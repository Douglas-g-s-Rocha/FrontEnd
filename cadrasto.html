<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cadastro de voluntários da ONG Esperança">
    <title>Cadastro - ONG Esperança</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>ONG Esperança</h1>

    <nav>
        <a href="index.html">Início</a>
        <a href="projetos.html">Projetos</a>
        <a href="cadastro.html">Seja Voluntário</a>
    </nav>
</header>

<main>

    <section>

        <h2>Cadastro de Voluntário</h2>

        <p>
            Preencha o formulário para participar
            das ações da ONG.
        </p>

        <form id="formulario">

            <fieldset>

                <legend>Dados pessoais</legend>

                <label for="nome">
                    Nome completo:
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    required>

                <span id="erroNome" class="erro"></span>


                <label for="email">
                    E-mail:
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required>

                <span id="erroEmail" class="erro"></span>


                <label for="telefone">
                    Telefone:
                </label>

                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(11) 99999-9999"
                    required>

                <span id="erroTelefone" class="erro"></span>


                <label for="cidade">
                    Cidade:
                </label>

                <input
                    type="text"
                    id="cidade"
                    name="cidade"
                    required>

                <span id="erroCidade" class="erro"></span>


                <button type="submit" class="botao">
                    Enviar cadastro
                </button>

            </fieldset>

        </form>

        <!-- Toast -->

        <div id="toast" class="toast">
            Cadastro realizado com sucesso!
        </div>

    </section>

</main>

<footer>
    <p>&copy; 2026 ONG Esperança - Projeto acadêmico</p>
</footer>

<script src="script.js"></script>

</body>
</html>
